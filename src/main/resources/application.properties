spring.application.name=urlshortener
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
app.snowflake.machine-id=${SNOWFLAKE_MACHINE_ID:1}
app.sharding.shards[0].url=${SHARD_0_URL:jdbc:postgresql://localhost:5432/urlshortener}
app.sharding.shards[0].username=${SHARD_0_USERNAME:${DB_USERNAME}}
app.sharding.shards[0].password=${SHARD_0_PASSWORD:${DB_PASSWORD}}
app.sharding.shards[1].url=${SHARD_1_URL:jdbc:postgresql://localhost:5433/urlshortener}
app.sharding.shards[1].username=${SHARD_1_USERNAME:${DB_USERNAME}}
app.sharding.shards[1].password=${SHARD_1_PASSWORD:${DB_PASSWORD}}