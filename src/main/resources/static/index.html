<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Shortener</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 32rem;
    margin: 4rem auto;
    padding: 0 1.5rem;
  }
  h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
  form { display: flex; gap: 0.5rem; }
  input[type="url"] {
    flex: 1;
    padding: 0.6rem 0.8rem;
    font-size: 1rem;
    border: 1px solid #8888;
    border-radius: 0.4rem;
  }
  button {
    padding: 0.6rem 1rem;
    font-size: 1rem;
    border: none;
    border-radius: 0.4rem;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #result { margin-top: 1.25rem; font-size: 0.95rem; }
  #result a { word-break: break-all; }
  .error { color: #dc2626; }
</style>
</head>
<body>
  <h1>URL Shortener</h1>
  <form id="shorten-form">
    <input type="url" id="url-input" placeholder="https://example.com/very/long/path" required>
    <button type="submit">Shorten</button>
  </form>
  <div id="result"></div>

<script>
  const form = document.getElementById('shorten-form');
  const input = document.getElementById('url-input');
  const result = document.getElementById('result');
  const button = form.querySelector('button');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    button.disabled = true;
    result.textContent = 'Shortening…';
    result.className = '';

    try {
      const res = await fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: input.value }),
      });
      const text = await res.text();

      if (!res.ok) {
        result.textContent = text || 'Something went wrong.';
        result.className = 'error';
        return;
      }

      result.innerHTML = '';
      const link = document.createElement('a');
      link.href = text;
      link.textContent = text;
      link.target = '_blank';
      result.appendChild(link);
    } catch (err) {
      result.textContent = 'Network error — is the server reachable?';
      result.className = 'error';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
